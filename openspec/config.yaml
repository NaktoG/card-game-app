schema: spec-driven

project: card-game-app
persistence_mode: hybrid
strict_tdd: true
review_budget:
  strategy: force-chained
  max_changed_lines: 400

context: |
  Tech stack: React 19 SPA, Vite, TypeScript strict, Tailwind CSS, Framer Motion, Zustand, i18next, Howler.js.
  Architecture: Static frontend monolith organized by feature modules with pure game domain logic separated from React and services.
  Runtime data: Deck of Cards API at runtime, localStorage/Zustand persistence for local ranking and settings, no backend/database.
  PWA: manifest, service worker registration, offline fallback, install prompt, theme metadata, SVG icons.
  Quality: ESLint flat config with typed TypeScript rules, Prettier, TypeScript build mode, Vitest jsdom setup.

testing:
  strict_tdd: true
  detected: 2026-07-27
  runner:
    framework: Vitest
    command: npm test
    watch_command: npm run test:watch
    environment: jsdom
    setup_files:
      - vitest.setup.ts
  layers:
    unit:
      available: true
      tool: Vitest
      evidence:
        - src/features/game/domain/cardMapper.test.ts
        - src/features/game/domain/gameReducer.test.ts
        - src/features/game/domain/gameRules.test.ts
    integration:
      available: true
      tool: Testing Library for React/jsdom available; no integration test files detected yet
    e2e:
      available: false
      tool: null
  coverage:
    available: false
    command: null
    notes: No coverage script or coverage provider configuration detected.
  quality_tools:
    linter:
      available: true
      command: npm run lint
    type_checker:
      available: true
      command: npm run typecheck
    formatter:
      available: true
      command: npm run format:check
    build:
      available: true
      command: npm run build

rules:
  proposal:
    - Keep changes scoped to one reviewable work unit unless explicitly approved.
    - Include rollback notes for persistence, PWA, deployment, or runtime API changes.
  specs:
    - Use RFC 2119 keywords and Given/When/Then scenarios.
    - Capture offline, local persistence, i18n, accessibility, and responsive behavior when affected.
  design:
    - Preserve pure domain logic in src/features/game/domain without React, DOM, network, or storage dependencies.
    - Keep runtime integrations behind services/stores/config modules.
    - Document trade-offs for PWA caching, localStorage, and external API behavior.
  tasks:
    - Keep task batches below the 400 changed-line review budget.
    - Pair behavior changes with relevant tests and docs updates.
  apply:
    guidelines:
      - Follow the existing feature-based architecture and strict TypeScript conventions.
      - Do not introduce backend/database assumptions without an SDD change.
      - Keep user-facing UI copy consistent with existing i18n conventions.
    tdd: true
    test_command: npm test
  verify:
    test_command: npm test
    lint_command: npm run lint
    typecheck_command: npm run typecheck
    build_command: npm run build
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas or changes to persisted localStorage keys.
